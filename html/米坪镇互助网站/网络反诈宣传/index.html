  answered = false;
  const q = QUESTIONS[cur];
  $("qNo").textContent = "第 " + (cur+1) + " 题";
  $("qIndex").textContent = "第 " + (cur+1) + " / " + QUESTIONS.length + " 题";
  $("scoreLabel").textContent = "✅ 已答对 " + score + " 题";
  $("qText").textContent = q.q;
  $("bar").style.width = (cur / QUESTIONS.length * 100) + "%";

  const box = $("options");
  box.innerHTML = "";
  q.opts.forEach((o, i)=>{
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="tag">' + TAGS[i] + '</span><span class="txt">' + o + '</span>';
    b.onclick = ()=>choose(i);
    box.appendChild(b);
  });

  const fb = $("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  const nb = $("nextBtn");
  nb.classList.remove("show");
  nb.textContent = (cur === QUESTIONS.length-1) ? "查看成绩 🎉" : "下一题 →";
  nb.onclick = next;
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[cur];
  const opts = $("options").children;
  for(let k=0;k<opts.length;k++) opts[k].classList.add("disabled");
  opts[q.correct].classList.add("correct");

  const fb = $("feedback");
  if(i === q.correct){
    score++;
    opts[i].classList.add("correct");
    fb.className = "feedback good";
    fb.innerHTML = "✅ 真棒！答对了！";
    setTimeout(next, 700);
  }else{
    opts[i].classList.add("wrong");
    for(let k=0;k<opts.length;k++) if(k!==i && k!==q.correct) opts[k].classList.add("dim");
    fb.className = "feedback bad";
    fb.innerHTML = "❌ 答错了，正确答案是 <b>" + TAGS[q.correct] + "．" + q.opts[q.correct] + "</b>";
  }
  $("scoreLabel").textContent = "✅ 已答对 " + score + " 题";
  if(i !== q.correct) $("nextBtn").classList.add("show");
}

function next(){
  cur++;
  if(cur < QUESTIONS.length){
    render();
  }else{
    $("bar").style.width = "100%";
    showResult();
  }
}

function showResult(){
  $("quizView").hidden = true;
  $("resultView").hidden = false;
  $("scoreNum").textContent = score;

  const ring = $("scoreRing");
  const pct = score / QUESTIONS.length;
  const color = pct >= 0.8 ? "#16a34a" : (pct >= 0.6 ? "#1d5bbf" : (pct >= 0.4 ? "#f5a623" : "#e11d2e"));
  ring.innerHTML = '<div class="num">' + score + '</div><div class="den">/ ' + QUESTIONS.length + '</div>';
  ring.style.background = "conic-gradient(" + color + " " + (pct*360) + "deg, #e5eaf2 0deg)";

  const tier = FEEDBACK_TIERS.find(t => score >= t.min);
  $("resultTitle").textContent = tier.title;
  $("resultMsg").textContent = tier.msg;
  $("resultTip").innerHTML = tier.tip;

  window.scrollTo({top:0, behavior:"smooth"});
}

function gotoPoster(){
  window.location.href = "poster.html";
}

function restart(){
  cur = 0; score = 0;
  $("resultView").hidden = true;
  $("quizView").hidden = false;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
