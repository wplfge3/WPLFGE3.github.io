<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="tmT tmD" width="900" height="460">
  <title id="tmT">山茱萸适生条件与西峡实际条件对照图</title>
  <desc id="tmD">四条横向刻度：海拔 400 至 1400 米、年平均气温 9 至 16 摄氏度、年降水量约 900 毫米、全年无霜期 190 至 280 天；西峡县的实际值分别为千余米、15 摄氏度、889.5 毫米、237 天，均落在适生区间内。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/><stop offset="100%" stop-color="#f3ecdc"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe0cb"/><stop offset="100%" stop-color="#b6cfb2"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392f"/><stop offset="100%" stop-color="#8f2f28"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" fill="url(#paper)"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#1c231b" letter-spacing="1"
        style="font-family:'Songti SC','SimSun',serif">山茱萸要什么条件，西峡刚好都有</text>
  <text x="40" y="74" font-size="13" fill="#6f7c6c"
        style="font-family:sans-serif">浅绿条＝官方公布的适生区间；红色标＝西峡县实际值</text>

  <!-- 图例 -->
  <g transform="translate(620,32)">
    <rect x="0" y="0" width="34" height="12" rx="3" fill="url(#band)" stroke="#8fae8b" stroke-width="1"/>
    <text x="42" y="11" font-size="12" fill="#5b6553" style="font-family:sans-serif">适生区间</text>
    <circle cx="131" cy="6" r="6" fill="url(#pin)"/>
    <text x="143" y="11" font-size="12" fill="#5b6553" style="font-family:sans-serif">西峡实际</text>
  </g>

  <!-- 刻度线（四条共用） -->
  <g stroke="#c9c3b0" stroke-width="1">
    <line x1="220" y1="104" x2="220" y2="372"/>
    <line x1="860" y1="104" x2="860" y2="372"/>
  </g>

  <!-- ============ 行 1：海拔 ============ -->
  <g>
    <text x="40" y="134" font-size="15" font-weight="600" fill="#2c3a2c" style="font-family:sans-serif">海拔</text>
    <text x="40" y="154" font-size="11.5" fill="#8a9384" style="font-family:sans-serif">400～1400 m</text>
    <line x1="220" y1="140" x2="860" y2="140" stroke="#ded7c5" stroke-width="1.5"/>
    <!-- 刻度：0 / 400 / 800 / 1200 / 1600 m -->
    <!-- x = 220 + v/1600*640 -->
    <rect x="380" y="128" width="400" height="24" rx="5" fill="url(#band)" stroke="#8fae8b" stroke-width="1"/>
    <g font-size="11" fill="#9aa392" text-anchor="middle" style="font-family:sans-serif">
      <text x="220" y="172">0</text><text x="380" y="172">400</text><text x="540" y="172">800</text>
      <text x="700" y="172">1200</text><text x="860" y="172">1600</text>
    </g>
    <path d="M640 122 l9 -13 l9 13 z" fill="url(#pin)"/>
    <circle cx="649" cy="140" r="7" fill="url(#pin)" stroke="#fbf7ee" stroke-width="2"/>
    <text x="649" y="112" font-size="12.5" font-weight="700" fill="#8f2f28" text-anchor="middle"
          style="font-family:sans-serif">米坪镇基地 千余米</text>
  </g>

  <!-- ============ 行 2：年平均气温 ============ -->
  <g>
    <text x="40" y="214" font-size="15" font-weight="600" fill="#2c3a2c" style="font-family:sans-serif">年平均气温</text>
    <text x="40" y="234" font-size="11.5" fill="#8a9384" style="font-family:sans-serif">9～16 ℃</text>
    <line x1="220" y1="220" x2="860" y2="220" stroke="#ded7c5" stroke-width="1.5"/>
    <!-- 0..25℃ ; x = 220 + v/25*640 = 220 + v*25.6 -->
    <rect x="450.4" y="208" width="179.2" height="24" rx="5" fill="url(#band)" stroke="#8fae8b" stroke-width="1"/>
    <g font-size="11" fill="#9aa392" text-anchor="middle" style="font-family:sans-serif">
      <text x="220" y="252">0</text><text x="348" y="252">5</text><text x="476" y="252">10</text>
      <text x="604" y="252">15</text><text x="732" y="252">20</text><text x="860" y="252">25</text>
    </g>
    <path d="M596 202 l9 -13 l9 13 z" fill="url(#pin)"/>
    <circle cx="605" cy="220" r="7" fill="url(#pin)" stroke="#fbf7ee" stroke-width="2"/>
    <text x="605" y="192" font-size="12.5" font-weight="700" fill="#8f2f28" text-anchor="middle"
          style="font-family:sans-serif">西峡 15 ℃</text>
  </g>

  <!-- ============ 行 3：年降水量 ============ -->
  <g>
    <text x="40" y="294" font-size="15" font-weight="600" fill="#2c3a2c" style="font-family:sans-serif">年降水量</text>
    <text x="40" y="314" font-size="11.5" fill="#8a9384" style="font-family:sans-serif">约 900 mm</text>
    <line x1="220" y1="300" x2="860" y2="300" stroke="#ded7c5" stroke-width="1.5"/>
    <!-- 0..1500mm ; x = 220 + v/1500*640 = 220 + v*0.42667 -->
    <rect x="561.3" y="288" width="85.3" height="24" rx="5" fill="url(#band)" stroke="#8fae8b" stroke-width="1"/>
    <g font-size="11" fill="#9aa392" text-anchor="middle" style="font-family:sans-serif">
      <text x="220" y="332">0</text><text x="433" y="332">500</text><text x="647" y="332">1000</text><text x="860" y="332">1500</text>
    </g>
    <path d="M594 282 l9 -13 l9 13 z" fill="url(#pin)"/>
    <circle cx="603" cy="300" r="7" fill="url(#pin)" stroke="#fbf7ee" stroke-width="2"/>
    <text x="603" y="272" font-size="12.5" font-weight="700" fill="#8f2f28" text-anchor="middle"
          style="font-family:sans-serif">西峡 889.5 mm</text>
  </g>

  <!-- ============ 行 4：无霜期 ============ -->
  <g>
    <text x="40" y="374" font-size="15" font-weight="600" fill="#2c3a2c" style="font-family:sans-serif">全年无霜期</text>
    <text x="40" y="394" font-size="11.5" fill="#8a9384" style="font-family:sans-serif">190～280 天</text>
    <line x1="220" y1="380" x2="860" y2="380" stroke="#ded7c5" stroke-width="1.5"/>
    <!-- 0..320天 ; x = 220 + v/320*640 = 220 + v*2 -->
    <rect x="600" y="368" width="180" height="24" rx="5" fill="url(#band)" stroke="#8fae8b" stroke-width="1"/>
    <g font-size="11" fill="#9aa392" text-anchor="middle" style="font-family:sans-serif">
      <text x="220" y="412">0</text><text x="380" y="412">80</text><text x="540" y="412">160</text>
      <text x="700" y="412">240</text><text x="860" y="412">320</text>
    </g>
    <path d="M685 362 l9 -13 l9 13 z" fill="url(#pin)"/>
    <circle cx="694" cy="380" r="7" fill="url(#pin)" stroke="#fbf7ee" stroke-width="2"/>
    <text x="694" y="352" font-size="12.5" font-weight="700" fill="#8f2f28" text-anchor="middle"
          style="font-family:sans-serif">西峡 237 天</text>
  </g>

  <text x="40" y="442" font-size="11.5" fill="#8a9384" style="font-family:sans-serif">
    适生区间：河南省林业局《河南林木良种：'伏牛红心'山茱萸》栽培技术要点（2026-03-03）；西峡实际值：河南省情网《西峡县》
  </text>
</svg>
